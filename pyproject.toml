[project]
name = "takt"
version = "0.5.0"
description = "Takt — кроссплатформенный менеджер задач с синхронизацией через Яндекс.Диск"
requires-python = ">=3.11"
dependencies = [
    "flet>=1.1.3",
    "requests>=2.32",
    "qrcode>=8.0",
    "cryptography>=44.0",
    "tzlocal>=5.3",
    "tzdata>=2025.1",
    "pyjnius>=1.9; platform_system == 'Android'",
]

[tool.flet]
product = "Takt"
org = "com.takt"

[tool.flet.android.permission]
"android.permission.REQUEST_INSTALL_PACKAGES" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.app]
module = "main"