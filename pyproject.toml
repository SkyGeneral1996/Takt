[project]
name = "tasksync"
version = "0.1.0"
description = "Кроссплатформенный менеджер задач с синхронизацией через Яндекс.Диск"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.1.3",
    "requests>=2.32",
]

[tool.flet]
product = "TaskSync"
org = "com.tasksync"

[tool.flet.app]
module = "main"